<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  
  <meta name="color-scheme" content="dark light" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Pre-warm the clips the visitor is guaranteed (hero loops, both
       themes) or most likely (the portal into chat) to need right away,
       so playback never has to cold-fetch+decode for the first time at
       the exact moment it needs to start - that initial fetch stall is a
       big part of why a first play can feel like it "sticks".
       NOTE: browsers don't actually support as="video" for link preload
       (even though it's technically a valid fetch destination in the spec) -
       as="fetch" is the standard workaround for preloading files that will
       be consumed by a <video> element. -->
  <link rel="preload" as="fetch" href="/video/pages/hero-light-loop.mp4" type="video/mp4" crossorigin>
  <link rel="preload" as="fetch" href="/video/pages/hero-dark-loop.mp4" type="video/mp4" crossorigin>
  <link rel="preload" as="fetch" href="/video/pages/portal-light.mp4" type="video/mp4" crossorigin>
  <link rel="preload" as="fetch" href="/video/pages/portal-dark.mp4" type="video/mp4" crossorigin>
  <!-- The chat page's background stills weren't being warmed up like the
       videos above, so the first trip through the portal could show a
       blank/black frame for a moment while the PNG was still being
       fetched+decoded right as the transition clip handed off. Preloading
       both themes here means the image is already in cache by the time
       PageStage actually mounts it. -->
  <link rel="preload" as="image" href="/assets/pages/chat-light.png">
  <link rel="preload" as="image" href="/assets/pages/chat-dark.png">
  <title>VEXA — A Presence When You Need One</title>
  <link rel="icon" type="image/png" href="/vexa-icon.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
